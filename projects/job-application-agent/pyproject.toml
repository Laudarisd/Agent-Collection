[project]
name = "local-job-agent"
version = "0.1.0"
description = "Local-first, human-reviewed job application assistant"
requires-python = ">=3.11"
dependencies = [
  "docx2txt>=0.8",
  "pydantic>=2.6,<3",
  "pypdf>=4,<6",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "streamlit>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

