# All managed projects live directly inside this folder.
repo_dir: "./repo"

github:
  remote_name: "origin"

  # New GitHub repositories created by GithubAuto use this visibility.
  # Allowed values: private, public
  default_visibility: "private"

  # Creating/deleting remote repositories uses the GitHub REST API.
  api_timeout_seconds: 30

git:
  # Smart Sync recommends rebase for diverged branches by default.
  # Allowed values: rebase, merge
  preferred_divergence_strategy: "rebase"

  # Number of commits shown in History.
  history_limit: 15

llm:
  # GithubAuto and llm_models are sibling folders:
  #
  # workspace/
  # ├── GithubAuto/
  # └── llm_models/
  model_path: "../llm_models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
  executable: "llama-cli"

  max_tokens: 48
  temperature: 0.1
  timeout_seconds: 180

safety:
  # Destructive operations require typed confirmation.
  confirm_destructive_actions: true

  # Remote repository deletion is intentionally disabled by default.
  # Set true only when you intentionally want that menu action enabled.
  allow_remote_repo_delete: false

  # Hard reset permanently discards local work and is disabled by default.
  allow_hard_reset: false
